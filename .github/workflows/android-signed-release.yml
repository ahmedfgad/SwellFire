name: Build signed Google Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Google Play target configuration
        run: python tools/check_android_config.py

      - name: Install Buildozer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'buildozer>=1.5,<2' 'Cython>=0.29.34,<3.2'

      - name: Cache the Buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v2-2204-${{ hashFiles('buildozer.spec', 'android/pip-constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v2-2204-

      - name: Restore the Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.SWELLFIRE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing SWELLFIRE_UPLOAD_KEYSTORE_BASE64 secret" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/swellfire-upload.keystore"

      - name: Verify upload certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SWELLFIRE_UPLOAD_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.SWELLFIRE_UPLOAD_KEYSTORE_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing SWELLFIRE_UPLOAD_KEYSTORE_PASSWORD secret" >&2; exit 1; }
          test -n "$KEYSTORE_ALIAS" || { echo "Missing SWELLFIRE_UPLOAD_KEYSTORE_ALIAS secret" >&2; exit 1; }
          actual="$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/swellfire-upload.keystore" \
            -alias "$KEYSTORE_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | sha256sum | awk '{print $1}')"
          expected="564b9f2769f6bd80eda784cb29886cc28f0375531d653718e4c3e52f7c889b96"
          if [ "$actual" != "$expected" ]; then
            echo "The configured keystore does not match SwellFire's Play upload certificate." >&2
            exit 1
          fi
          echo "Verified the established SwellFire Play upload certificate."

      - name: Build signed Google Play App Bundle
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/swellfire-upload.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.SWELLFIRE_UPLOAD_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.SWELLFIRE_UPLOAD_KEYSTORE_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.SWELLFIRE_UPLOAD_KEYSTORE_PASSWORD }}
          PIP_CONSTRAINT: ${{ github.workspace }}/android/pip-constraints.txt
        run: |
          buildozer android release
          bundle="$(find bin -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$bundle" || { echo "No .aab was produced" >&2; ls -la bin; exit 1; }
          echo "BUNDLE_PATH=$bundle" >> "$GITHUB_ENV"

      - name: Upload the signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Swellfire-Play-${{ github.run_number }}
          path: ${{ env.BUNDLE_PATH }}
          if-no-files-found: error
          retention-days: 14

